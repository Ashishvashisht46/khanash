<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Security / HIPAA compliance meta tags -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="referrer" content="no-referrer" />

    <!-- App meta -->
    <meta name="description" content="Lux Dental Marketing - RCM Portal" />
    <meta name="theme-color" content="#0B1624" />
    <meta name="color-scheme" content="dark" />

    <!-- Prevent caching of sensitive pages -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Manrope:wght@300;400;500;600;700;800&family=Noto+Serif:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- Material Symbols Outlined (icon font) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />

    <title>Lux Dental Marketing — RCM Portal</title>

    <!-- Inline critical styles to prevent FOUC -->
    <style>
      html,
      body {
        background-color: #0a141e;
        color: #e8e0d0;
        margin: 0;
        padding: 0;
      }
      #root {
        min-height: 100vh;
      }
      /* Hide app content until fonts are loaded to prevent FOUT */
      .fonts-loading {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
