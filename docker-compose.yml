services:
  db:
    image: postgres:16-alpine
    container_name: rcm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rcm
      POSTGRES_PASSWORD: rcm_password
      POSTGRES_DB: dental_rcm
    ports:
      - "5432:5432"
    volumes:
      - rcm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rcm -d dental_rcm"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    container_name: rcm-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://rcm:rcm_password@db:5432/dental_rcm"
      JWT_SECRET: "dev-secret-change-me-in-production"
      JWT_EXPIRY: "24h"
      GOOGLE_CLIENT_ID: "your-google-client-id"
      PORT: "4000"
      CLIENT_URL: "http://localhost:5173"
      NODE_ENV: "development"
    ports:
      - "4000:4000"
    volumes:
      - ./server:/app
      - /app/node_modules
    command: sh -c "npx prisma generate && npx prisma db push --accept-data-loss && npx prisma db seed && npm run dev"

  client:
    build: ./client
    container_name: rcm-client
    restart: unless-stopped
    depends_on:
      - server
    environment:
      VITE_API_URL: "http://localhost:4000/api"
      VITE_GOOGLE_CLIENT_ID: "your-google-client-id"
    ports:
      - "5173:3000"
    volumes:
      - ./client:/app
      - /app/node_modules
    command: sh -c "npm run dev -- --host 0.0.0.0"

volumes:
  rcm_pgdata:
